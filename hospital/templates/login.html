<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - MediCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            background:
            linear-gradient(
            rgba(37,99,235,0.75),
            rgba(56,189,248,0.70)
            ),

            url('https://images.unsplash.com/photo-1587351021759-3e566b3db4f1?q=80&w=1600');

            background-size:cover;
            background-position:center;
        }

        .login-card{

            width:100%;
            max-width:420px;

            background:rgba(255,255,255,0.18);

            backdrop-filter:blur(14px);

            border-radius:30px;

            padding:45px;

            box-shadow:0 8px 30px rgba(0,0,0,0.2);

            border:1px solid rgba(255,255,255,0.25);

            color:white;
        }

        .login-card h1{

            text-align:center;

            font-weight:700;

            margin-bottom:35px;
        }

        .form-control{

            height:55px;

            border:none;

            border-radius:15px;

            padding-left:15px;

            margin-bottom:20px;
        }

        .form-control:focus{

            box-shadow:none;
        }

        .login-btn{

            width:100%;

            height:55px;

            border:none;

            border-radius:15px;

            background:white;

            color:#2563eb;

            font-weight:600;

            font-size:18px;

            transition:0.3s ease;
        }

        .login-btn:hover{

            background:#dbeafe;

            transform:translateY(-2px);
        }

        .bottom-text{

            text-align:center;

            margin-top:20px;

            font-size:15px;
        }

        .bottom-text a{

            color:white;

            font-weight:600;

            text-decoration:none;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <h1>
            Welcome Back
        </h1>
        {% if messages %}

    {% for message in messages %}

        <div class="alert alert-danger">

            {{ message }}

        </div>

    {% endfor %}

{% endif %}
        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter Password"
                   required>

            <button type="submit"
                    class="login-btn">

                Login

            </button>

        </form>

        <div class="bottom-text">

            Book appointments securely with MediCare.

        </div>

    </div>

</body>

</html>

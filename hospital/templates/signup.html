<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MediCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }
        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
            linear-gradient(
            rgba(37,99,235,0.75),
            rgba(56,189,248,0.70)
            ),
            url('https://images.unsplash.com/photo-1587351021759-3e566b3db4f1?q=80&w=1600');
            background-size:cover;
            background-position:center;
        }
        .signup-card{
            width:100%;
            max-width:450px;
            background:rgba(255,255,255,0.18);
            backdrop-filter:blur(14px);
            border-radius:30px;
            padding:45px;
            box-shadow:0 8px 30px rgba(0,0,0,0.2);
            border:1px solid rgba(255,255,255,0.25);
            color:white;
        }
        .signup-card h1{
            text-align:center;
            margin-bottom:35px;
            font-weight:700;
        }
        .form-control{
            height:55px;
            border:none;
            border-radius:15px;
            margin-bottom:20px;
        }
        .signup-btn{
            width:100%;
            height:55px;
            border:none;
            border-radius:15px;
            background:white;
            color:#2563eb;
            font-size:18px;
            font-weight:600;
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <h1>
            Create Account
        </h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Username"
                   required>
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Email"
                   required>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Password"
                   required>
            <button type="submit"
                    class="signup-btn">
                Sign Up
            </button>
        </form>
    </div>
</body>
</html>

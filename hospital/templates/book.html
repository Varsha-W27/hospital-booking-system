<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - MediCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }
        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
            linear-gradient(
            rgba(37,99,235,0.75),
            rgba(56,189,248,0.70)
            ),
            url('https://images.unsplash.com/photo-1587351021759-3e566b3db4f1?q=80&w=1600');
            background-size:cover;
            background-position:center;
            padding:40px;
        }
        .appointment-card{
            width:100%;
            max-width:550px;
            background:rgba(255,255,255,0.18);
            backdrop-filter:blur(14px);
            border-radius:30px;
            padding:45px;
            box-shadow:0 8px 30px rgba(0,0,0,0.2);
            border:1px solid rgba(255,255,255,0.25);
            color:white;
        }
        .appointment-card h1{
            text-align:center;
            font-weight:700;
            margin-bottom:35px;
        }
        .form-control,
        .form-select{
            height:55px;
            border:none;
            border-radius:15px;
            padding-left:15px;
            margin-bottom:20px;
        }
        .form-control:focus,
        .form-select:focus{
            box-shadow:none;
        }
        .book-btn{
            width:100%;
            height:55px;
            border:none;
            border-radius:15px;
            background:white;
            color:#2563eb;
            font-weight:600;
            font-size:18px;
            transition:0.3s ease;
        }
        .book-btn:hover{
            background:#dbeafe;
            transform:translateY(-2px);
        }
        .bottom-text{
            text-align:center;
            margin-top:20px;
            font-size:15px;
        }
    </style>
</head>
<body>
    <div class="appointment-card">
        <h1>
            Book Appointment
        </h1>
        <form method="POST">
            {% csrf_token %}
            <select name="doctor_name"
                    class="form-select"
                    required>

                <option value="">
                    Select Doctor
                </option>

                <option>
                    Dr. Priya Sharma - Cardiologist
                </option>

                <option>
                    Dr. Rahul Mehta - Neurologist
                </option>

                <option>
                    Dr. Anjali Verma - Dentist
                </option>
            </select>
                <input type="date"
                   name="appointment_date"
                   class="form-control"
                   required>
     <select name="appointment_time"
        class="form-select"
        required>
    <option value="">
        Select Time Slot
    </option>

    <option value="09:00:00">
        09:00 AM
    </option>

    <option value="10:00:00">
        10:00 AM
    </option>

    <option value="11:00:00">
        11:00 AM
    </option>

    <option value="12:00:00">
        12:00 PM
    </option>

    <option value="14:00:00">
        02:00 PM
    </option>

    <option value="15:00:00">
        03:00 PM
    </option>

    <option value="16:00:00">
        04:00 PM
    </option>
</select>
            <button type="submit"
                    class="book-btn">
                Confirm Appointment
            </button>
        </form>
        <div class="bottom-text">
            Secure and seamless appointment booking with MediCare.
        </div>
    </div>
</body>
</html>
